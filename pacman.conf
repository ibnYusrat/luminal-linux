[options]
Architecture = auto
Color
CheckSpace
ParallelDownloads = 8
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# --- Custom Local Distribution Repository for Staged AUR Packages ---
[custom-distro-repo]
SigLevel = Optional TrustAll
Server = file:///workspace/repo

# --- Official Arch Linux Repositories ---
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
