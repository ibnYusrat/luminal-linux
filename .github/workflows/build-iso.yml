name: Build & Release Custom Arch Linux ISO

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  schedule:
    - cron: '0 0 * * 0' # Automatically run every Sunday at 00:00 UTC
  workflow_dispatch:   # Allows manual trigger button in GitHub Actions tab
    inputs:
      publish_release:
        description: 'Publish as a GitHub Release'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build Custom Arch ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force
          df -h

      - name: Build ISO inside Arch Linux Container
        run: |
          docker run --rm --privileged \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            archlinux:base-devel bash -c "
              echo '==> 1. Updating Pacman and installing Archiso & build tools...'
              pacman -Syu --noconfirm base-devel archiso git sudo pacman-contrib zstd jq libxml2 lua file libarchive

              echo '==> 2. Setting up unprivileged build user...'
              useradd -m builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              chown -R builder:builder /workspace

              echo '==> 3. Building / Updating AUR Package Repository...'
              su builder -c 'bash ./scripts/build-aur-repo.sh'

              echo '==> 4. Building Distro ISO...'
              bash ./build-iso.sh
              chmod -R 777 /workspace/out /workspace/repo 2>/dev/null || true
            "

      - name: Inspect & Calculate Checksums
        id: meta
        run: |
          sudo chown -R $USER:$USER .
          ISO_FILE=$(ls out/*.iso | head -n 1)
          ISO_NAME=$(basename "${ISO_FILE}")
          SHA256=$(sha256sum "${ISO_FILE}" | awk '{print $1}')
          TAG="v$(date +'%Y.%m.%d')"
          
          echo "iso_path=${ISO_FILE}" >> $GITHUB_OUTPUT
          echo "iso_name=${ISO_NAME}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          echo "SHA256: ${SHA256}" > "${ISO_FILE}.sha256"

      - name: Commit Upstream Caelestia & Dependency Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(upstream): sync Caelestia dotfiles and shell dependencies [skip ci]"
          branch: master
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Upload Single Latest ISO to Cloudflare R2
        if: ${{ github.event_name == 'schedule' || github.event.inputs.publish_release == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            wrangler r2 object put luminal-iso/luminal-linux-latest-x86_64.iso --file="${{ steps.meta.outputs.iso_path }}" --remote
            wrangler r2 object put luminal-iso/luminal-linux-latest-x86_64.iso.sha256 --file="${{ steps.meta.outputs.iso_path }}.sha256" --remote

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ github.event_name == 'schedule' || github.event.inputs.publish_release == 'true' }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Luminal Linux Rolling Release (${{ steps.meta.outputs.tag }})"
          draft: false
          prerelease: false
          files: |
            ${{ steps.meta.outputs.iso_path }}.sha256
          body: |
            ## Luminal Linux - Official Rolling Release (${{ steps.meta.outputs.tag }})

            Modern Arch Linux distribution featuring Hyprland, Caelestia Shell, Material You dynamic theming, and an offline desktop installer.

            ### Download Single ISO Image
            * **Direct CDN Download (Cloudflare R2):** [luminal-linux-latest-x86_64.iso](https://pub-cbcfa9ec784041be86b3c0bff0b89ad2.r2.dev/luminal-linux-latest-x86_64.iso)
            * **SHA256 Checksum:** `${{ steps.meta.outputs.sha256 }}`

            ### Flashing to USB
            ```bash
            # 1. Download the single ISO image
            curl -LO https://pub-cbcfa9ec784041be86b3c0bff0b89ad2.r2.dev/luminal-linux-latest-x86_64.iso

            # 2. Flash to USB drive (replace /dev/sdX with target drive)
            sudo dd bs=4M if=luminal-linux-latest-x86_64.iso of=/dev/sdX status=progress oflag=sync
            ```
