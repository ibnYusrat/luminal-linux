[ids]
*

[main]
# Default base layer

# ==========================================
# ALT acts as CMD (App Shortcuts & Line Navigation)
# ==========================================
[alt]
# Clipboard & Text Editing
c = C-c
v = C-v
x = C-x
z = C-z
a = C-a
s = C-s
f = C-f

# Browser / App Navigation
t = C-t
w = C-w
r = C-r
l = C-l
n = C-n
o = C-o
p = C-p
k = C-k
q = C-q

# Tab Switching (Alt + 1..9 -> Ctrl + 1..9)
1 = C-1
2 = C-2
3 = C-3
4 = C-4
5 = C-5
6 = C-6
7 = C-7
8 = C-8
9 = C-9

# Line Deletion
backspace = macro(S-home 10ms backspace)
delete = macro(S-end 10ms backspace)

# Line Navigation
left = home
right = end
up = C-home
down = C-end

[alt+shift]
z = C-S-z
t = C-S-t
r = C-S-r
w = C-S-w
n = C-S-n
p = C-S-p
left = S-home
right = S-end
up = C-S-home
down = C-S-end

# Preserve screenshot chords under Alt+Shift
3 = A-S-3
4 = A-S-4
5 = A-S-5

[control+alt+shift]
# Preserve Ctrl+Alt+Shift screenshot/hotkey combinations
3 = C-A-S-3
4 = C-A-S-4
5 = C-A-S-5

# ==========================================
# SUPER acts as OPTION (Word Navigation & Deletion)
# ==========================================
[meta]
# Word Deletion
backspace = C-backspace
delete = C-delete

# Word Navigation
left = C-left
right = C-right
up = pageup
down = pagedown

[meta+shift]
# Word Selection
left = C-S-left
right = C-S-right

# ==========================================
# Preserve CTRL + SUPER (Hyprland Workspaces & Window Ops)
# ==========================================
[control+meta]
left = C-M-left
right = C-M-right
up = C-M-up
down = C-M-down
backspace = C-M-backspace
space = C-M-space
equal = C-M-equal
minus = C-M-minus
backslash = C-M-backslash

[control+meta+shift]
left = C-M-S-left
right = C-M-S-right
up = C-M-S-up
down = C-M-S-down
4 = C-M-S-4
