# Kitty Configuration

# Background Opacity
background_opacity 0.85
dynamic_background_opacity yes

# Cursor Trail
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Clipboard Mappings
map alt+c copy_to_clipboard
map alt+v paste_from_clipboard

# Word Navigation Mappings (Super + Left / Right / Backspace)
map super+left send_text all \x1b[1;5D
map super+right send_text all \x1b[1;5C
map super+backspace send_text all \x17



